# Editorials je Monatsausgabe (Ausgabe = alle Artikel eines Monats).
# Fehlt ein Monat, baut der Generator eine Ausgabe ohne Editorial.
"2025-10":
  titel: "Herbst ist Planungszeit"
  editorial: >
    Die Saison läuft aus, die nächste beginnt am Schreibtisch. Wer im Oktober weiß, welche Positionen er zum Saisonstart besetzen muss, hat noch die Wahl; wer im März sucht, nimmt, was übrig ist. Diese Ausgabe ordnet ein, was der Arbeitsmarkt im Winter tatsächlich bewegt, warum Eigenkündigungen heute die Regel sind, was der Baggerschein rechtlich ist – und warum der Oktober der beste Pflanzmonat bleibt.
"2025-11":
  titel: "Zahlen statt Bauchgefühl"
  editorial: >
    Der BGL hat 668 Betriebe befragt, das Kabinett den Mindestlohn beschlossen, der Bundesgerichtshof die Regeln für den Winterdienst nachgeschärft. Dazu die Zeitfenster für Laubbläser im Wohngebiet und ein Praxisstück zum Jahresgespräch – dem günstigsten Instrument gegen Kündigungen im Frühjahr.
"2025-12":
  titel: "Schlechtwetterzeit"
  editorial: >
    Vom 1. Dezember an gilt die Schlechtwetterzeit. Für viele Betriebe heißt das Saison-Kurzarbeit statt Entlassung. Wir erklären, was Beton, Pflaster und Pflanzen bei Frost vertragen, welche Wege das neue Einwanderungsrecht für Fachkräfte aus dem Ausland öffnet, was der Marktreport zum Gebäudegrün zeigt – und ziehen Bilanz über zwölf Monate.
"2026-01":
  titel: "Was das Jahr bringt"
  editorial: >
    Das Trendbarometer der Messe nennt drei Themen für 2026: Klimaanpassung, Fachkräfte, emissionsfreie Technik. Dazu drei Wege nach oben und nach draußen: die Meisterschule mit Aufstiegs-BAföG, die Motorsägenausbildung nach DGUV 214-059 und die neuen Wertgrenzen für öffentliche Aufträge. Und: wie Betriebe bei privaten Auftraggebern sichtbar werden.
"2026-02":
  titel: "Die Branche in Zahlen"
  editorial: >
    11,11 Milliarden Euro Umsatz, 131.746 Beschäftigte, 8.089 Auszubildende, 133 Insolvenzen: Die Branchenstatistik 2025 ist da. Wir lesen sie zusammen mit den Arbeitsmarktdaten zum Jahresauftakt, der vollständigen Lohn- und Gehaltstabelle des Tarifs und den Regeln, die bei Abmahnung und Kündigung im Kolonnenalltag zählen.
"2026-03":
  titel: "Saisonstart"
  editorial: >
    Sechs Themen aus dem Betriebsalltag, die gern liegen bleiben: der Maschinen-Check mit seinen Prüfpflichten, die Fortbildungspflicht im Pflanzenschutz, die Führerscheinfrage beim Anhänger, die Pflanzenkenntnis-Prüfung der Azubis und der Weg vom Landschaftsgärtner zum Bauleiter. Dazu die Preisträger des BGL-Bildungspreises 2026.
"2026-04":
  titel: "Wasser in der Stadt"
  editorial: >
    Vier Landesgartenschauen öffnen, Regengärten und Schwammstadt-Konzepte werden vom Fachbegriff zum Auftrag. Außerdem: was Zeitarbeit im GaLaBau darf, was das Arbeitszeitgesetz in der Saison erlaubt – und warum 186.000 Unternehmen bis 2030 einen Nachfolger brauchen.
"2026-05":
  titel: "Stimmung und Substanz"
  editorial: >
    Die Frühjahrsumfrage zeigt volle Auftragsbücher bei dünnen Erträgen. Wir schauen auf die Zukunftsbäume der GALK-Liste, auf ein Onboarding über 90 Tage, auf die Rolle des Vorarbeiters als wichtigste Führungskraft im Betrieb – und auf 185 FSME-Risikogebiete, in denen Kolonnen jeden Tag arbeiten.
"2026-06":
  titel: "Hitze, Extras, Insolvenzen"
  editorial: >
    Ab UV-Index 3 gelten Pflichten, der Referentenentwurf zur Zeiterfassung liegt vor, Creditreform meldet die meisten Insolvenzen seit 2013. Dazu: steuerfreie Extras, die nach dem Ende der Inflationsausgleichsprämie noch möglich sind, und KI-gestützte Angebote, die heute schon funktionieren.
"2026-07":
  titel: "Tarif, Unfälle, Trockenheit"
  editorial: >
    Seit dem 1. Juli gilt der Ecklohn von 20,91 Euro. Die BG BAU meldet erstmals unter 90.000 Arbeitsunfälle, die DAK einen Krankenstand, dessen Langzeitfälle die Branche treffen. Und die Bewässerung junger Bäume wird zur Planungsaufgabe. Dazu ein Praxisstück zur Probearbeit.
"2026-08":
  titel: "Werkzeuge für den Herbst"
  editorial: >
    E-Rechnung, Wasserentnahmeverbote, Werkzeuge für Bauleiter, die erste Woche der neuen Azubis und ein ifo-Index, der weniger Pessimismus zeigt: Diese Ausgabe ist ein Werkzeugkasten. Wer im Herbst umstellt, arbeitet ab Januar ruhiger.
"2026-09":
  titel: "Nürnberg"
  editorial: >
    Vom 15. bis 18. September trifft sich die Branche zur GaLaBau. Wir haben das Messeprogramm gelesen, die E-Maschinen der Aussteller angeschaut, den Winterdienst-Plan vorgezogen und die Frage mitgenommen, die in jeder Halle gestellt wird: Wo kommen die Leute her? Unsere Branchenumfrage 2026 sucht Antworten.
