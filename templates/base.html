{% set root = '../' * depth %}
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A1710">
  <title>{% block title %}{{ site.name }} – {{ site.claim }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.claim }}: Betrieb, Recht, Technik, Bauen, Markt, Sicherheit, Karriere.{% endblock %}">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:type" content="{% block ogtype %}website{% endblock %}">
  {% block og %}{% endblock %}
  <link rel="icon" type="image/png" href="{{ root }}assets/favicon-32.png">
  <link rel="apple-touch-icon" href="{{ root }}assets/apple-touch-icon.png">
  <link rel="preload" href="{{ root }}assets/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ root }}assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ root }}assets/kompass.css">
  {% block head %}{% endblock %}
</head>
<body data-depth="{{ depth }}" class="{% block bodyclass %}{% endblock %}">
  <a class="skip" href="#inhalt">Zum Inhalt</a>
  <header data-kompass-header></header>
  <main id="inhalt">
  {% block content %}{% endblock %}
  </main>
  <footer data-kompass-footer></footer>
  <script src="{{ root }}assets/kompass.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
