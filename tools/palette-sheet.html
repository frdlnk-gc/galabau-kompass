<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>GaLaBau Kompass · Farbwelten-Vergleich</title>
<link rel="stylesheet" href="../assets/kompass.css">
<style>
  html,body{background:#fff;color:#0B1F14;}
  .sheet{width:1600px;padding:36px 40px;}
  .sheet h1{font-family:var(--font-serif);font-weight:600;font-size:30px;letter-spacing:-.02em;}
  .sheet .sub{color:#4B5A50;font-size:14px;margin:6px 0 24px;}
  .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
  .panel{border:1px solid #E5E1D6;border-radius:18px;overflow:hidden;}
  .panel .name{padding:12px 16px;font-weight:800;font-size:14px;border-bottom:1px solid #E5E1D6;display:flex;justify-content:space-between;align-items:center;}
  .panel .name small{font-weight:600;color:#8A958D;}
  .p-dark{padding:26px 22px 24px;color:var(--ink);background:radial-gradient(110% 60% at 90% -10%,var(--accent-soft),transparent 60%),linear-gradient(175deg,#10281B 0%,var(--bg) 62%);}
  .p-dark h2{font-family:var(--font-serif);font-weight:600;font-size:28px;line-height:1.05;letter-spacing:-.02em;margin-top:16px;}
  .p-dark h2 i{color:var(--accent);}
  .p-dark p{color:var(--ink-dim);font-size:13.5px;margin-top:10px;}
  .p-dark .btn{margin-top:16px;font-size:14px;padding:12px 18px;}
  .p-light{padding:20px 22px;background:var(--paper);}
  .p-light .card{padding:16px;}
  .p-light .tag{font-size:10px;}
  .p-light h3{font-family:var(--font-serif);font-weight:600;font-size:17px;line-height:1.2;margin-top:6px;}
  .p-light p{font-size:12.5px;color:#4B5A50;margin-top:6px;}
  .swatches{display:flex;gap:6px;margin-top:14px;}
  .sw{width:34px;height:34px;border-radius:9px;border:1px solid rgba(0,0,0,.08);}
  .sw-lab{font-size:10px;color:#8A958D;margin-top:6px;letter-spacing:.02em;}
  .polo{display:flex;gap:14px;align-items:center;margin-top:14px;padding:12px;background:#111;border-radius:12px;color:#F4F1E8;}
  .polo .logo-word{font-size:15px;}
  .polo .logo svg{height:24px;}
  .polo .hint{font-size:10px;color:rgba(244,241,232,.55);}
  .notice-preview{display:none!important;}
</style>
</head>
<body>
<div class="sheet">
  <h1>GaLaBau Kompass · Farbwelten</h1>
  <div class="sub">Basis in allen Varianten: Tiefgrün #0A1710, Creme #F4F2EB, Fraunces + Inter (Q4-Effekt-Optik). Unterschied = der eine Akzent. Variante 1 ist die Arbeitsbasis.</div>
  <div class="cols" id="cols"></div>
</div>
<script src="../assets/kompass.js"></script>
<script>
  var variants = [
    { key:'', name:'1 · Honig', sub:'#D4A63C', hint:'seriös, warm, dein Gelb' },
    { key:'terrakotta', name:'2 · Terrakotta', sub:'#C0603A', hint:'erdig, handwerklich, dein Rot' },
    { key:'mint', name:'3 · Mint', sub:'#6EE7A0', hint:'1:1 Q4-Effekt' },
    { key:'anthrazit', name:'4 · Anthrazit + Grün', sub:'#22C55E', hint:'technischer, weit weg von GC' }
  ];
  var cols = document.getElementById('cols');
  variants.forEach(function(v){
    var el = document.createElement('div'); el.className = 'panel';
    el.innerHTML = '<div class="name">' + v.name + '<small>' + v.hint + '</small></div>' +
      '<div class="p-dark on-dark" data-palette="' + v.key + '"><span data-logo></span><h2>Wie gut ist Ihr <i>Standort</i> für Fachkräfte?</h2><p>Der Standort-Check zeigt, wie viele Landschaftsgärtner, Vorarbeiter und Bauleiter im Umkreis erreichbar sind.</p><a class="btn">Standort prüfen →</a></div>' +
      '<div class="p-light on-light"><div class="card"><span class="tag">Markt &amp; Zahlen</span><h3>11,11 Milliarden Euro Umsatz, 133 Insolvenzen: Der GaLaBau in Zahlen</h3><p>Was die BGL-Statistik 2025 über den Markt sagt.</p></div>' +
      '<div class="swatches"><div class="sw" style="background:#0A1710"></div><div class="sw" style="background:#F4F2EB"></div><div class="sw" style="background:var(--accent)"></div><div class="sw" style="background:var(--accent-deep)"></div><div class="sw" style="background:var(--card)"></div></div><div class="sw-lab">Grund · Creme · Akzent · Akzent tief · Karte</div>' +
      '<div class="polo"><span data-logo-polo></span><span class="hint">Polo schwarz, Logo creme + Akzent</span></div></div>';
    cols.appendChild(el);
  });
  // Paletten wirken über CSS-Variablen auf body – für das Blatt je Panel via inline style kopieren
  document.querySelectorAll('.panel').forEach(function(p, i){
    var v = variants[i]; var probe = document.createElement('div'); probe.style.display='none'; document.body.appendChild(probe);
    document.body.setAttribute('data-palette', v.key);
    var cs = getComputedStyle(document.body);
    ['--accent','--accent-deep','--accent-bright','--accent-ink','--accent-soft','--accent-line','--bg','--bg-2','--card'].forEach(function(n){ p.style.setProperty(n, cs.getPropertyValue(n)); });
    document.body.removeAttribute('data-palette');
    p.querySelector('[data-logo]').innerHTML = window.kompassLogo({size:''});
    p.querySelector('[data-logo-polo]').innerHTML = window.kompassLogo({size:''});
  });
</script>
</body>
</html>
