<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>GaLaBau Kompass · Logo</title>
<link rel="stylesheet" href="../assets/kompass.css">
<style>
  html,body{background:#fff;}
  .sheet{width:1400px;padding:40px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;}
  .box{border-radius:18px;padding:40px;display:flex;align-items:center;justify-content:center;min-height:220px;}
  .dark{background:#0A1710;color:#F4F1E8;}
  .light{background:#F4F2EB;color:#0B1F14;}
  .black{background:#111;color:#F4F1E8;}
  .white{background:#fff;color:#0B1F14;border:1px solid #E5E1D6;}
  .stack{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}
  .stack svg{height:120px;width:auto;}
  .stack .w{font-family:var(--font-serif);font-weight:600;font-size:48px;letter-spacing:-.02em;line-height:1;}
  .stack .w i{font-style:italic;color:var(--accent);}
  .stack .t{font-family:var(--font-sans);font-size:12px;letter-spacing:.22em;text-transform:uppercase;opacity:.6;}
  .logo.xl svg{height:88px;}
  .logo.xl .logo-word{font-size:64px;}
  .cap{font:600 12px/1.4 Inter,sans-serif;color:#8A958D;margin-top:8px;}
  h1{font-family:var(--font-serif);font-weight:600;font-size:28px;margin-bottom:18px;}
  .notice-preview{display:none!important;}
</style>
</head>
<body>
<div class="sheet">
  <h1>GaLaBau Kompass · Logo-System</h1>
  <div class="row">
    <div><div class="box dark" id="l1"></div><div class="cap">Primär · horizontal · auf Tiefgrün</div></div>
    <div><div class="box light" id="l2"></div><div class="cap">Primär · horizontal · auf Creme</div></div>
  </div>
  <div class="row">
    <div><div class="box black" id="l3"></div><div class="cap">Gestapelt · für Polo (schwarz) und Social</div></div>
    <div><div class="box white" id="l4"></div><div class="cap">Bildmarke solo · Favicon / App-Icon</div></div>
  </div>
</div>
<script src="../assets/kompass.js"></script>
<script>
  document.getElementById('l1').innerHTML = window.kompassLogo({size:'lg'}).replace('class="logo lg"','class="logo xl"');
  document.getElementById('l2').innerHTML = window.kompassLogo({size:'lg'}).replace('class="logo lg"','class="logo xl on-light"');
  var mark = window.kompassLogo({word:false}).replace(/<a [^>]+>|<\/a>/g,'');
  document.getElementById('l3').innerHTML = '<div class="stack">' + mark + '<div class="w">GaLaBau <i>Kompass</i></div><div class="t">Das Magazin für den Garten- und Landschaftsbau</div></div>';
  document.getElementById('l4').innerHTML = '<div class="stack on-light">' + mark + '</div>';
</script>
</body>
</html>
