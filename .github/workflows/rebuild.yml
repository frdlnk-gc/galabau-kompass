# Täglicher Neuaufbau der Seite: Termine wandern automatisch nach "Bereits vorbei",
# "Neu"-Markierungen und Datumsbezüge bleiben aktuell, ohne dass jemand baut.
name: Täglicher Rebuild
on:
  schedule:
    - cron: "30 3 * * *"   # 05:30 MESZ
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml markdown jinja2
      - run: python3 tools/build.py
      - name: Änderungen einchecken
        run: |
          git config user.name "kompass-rebuild"
          git config user.email "redaktion@galabau-kompass.de"
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderung."; else git commit -m "Täglicher Rebuild $(date -u +%F)" && git push; fi
